name: SugarWOD Coach
version: "0.1.0"
slug: sugarwod_coach
description: Wertet SugarWOD-Workouts aus – Gewichtsvorschläge, Verlauf, Stärken und Schwächen
url: https://github.com/Tom433/sugarwod-ha-addon
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:weight-lifter
panel_title: SugarWOD Coach
homeassistant_api: true
map:
  - share:rw
options:
  export_unit: lbs
  display_unit: kg
  plate_increment: 2.5
  formula: mittel
  body_weight_kg: 0
  ha_sensors: true
  sensor_lifts:
    - Back Squat
    - Front Squat
    - Deadlift
    - Clean
    - Snatch
    - Clean & Jerk
    - Strict Press
  watch_folder: /share/sugarwod
schema:
  export_unit: list(lbs|kg)
  display_unit: list(kg|lbs)
  plate_increment: float(0.5,10)
  formula: list(epley|brzycki|mittel)
  body_weight_kg: float(0,250)
  ha_sensors: bool
  sensor_lifts:
    - str
  watch_folder: str
